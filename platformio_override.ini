[env:oled]
extends = env:wifi
build_src_filter = ${env:wifi.build_src_filter} +<src/OLED.cpp>

; extra_scripts REPLACES the value inherited via "extends" rather than adding to
; it, so these must repeat ${common_esp32.extra_scripts} explicitly.  Leaving it
; out silently drops FluidNC/ld/esp32/vtable_in_dram.py, which is what puts the
; PinDetail and Spindle vtables in DRAM.  Without it they land in flash, and the
; step ISR reads them - which panics the board whenever the flash cache happens
; to be disabled.

[env:wifi]
extra_scripts =
    ${common_esp32.extra_scripts}
    pre:FluidNC/ld/esp32/i2s_engine_fpermissive.py

[env:noradio]
extra_scripts =
    ${common_esp32.extra_scripts}
    pre:FluidNC/ld/esp32/i2s_engine_fpermissive.py

[env:bt]
extra_scripts =
    ${common_esp32.extra_scripts}
    pre:FluidNC/ld/esp32/i2s_engine_fpermissive.py

; ESP32-S3 build for the custom board: same as wifi_s3_octalPSRAM plus the
; OLED module (esp32/OLED.cpp), which common_esp32s3 excludes by default.
[env:wifi_s3_octalPSRAM_oled]
extends = env:wifi_s3_octalPSRAM
build_src_filter =
    ${common_esp32s3.build_src_filter}
    ${common_wifi.build_src_filter}
    +<../esp32/ESPNow>
    +<../esp32/OLED.cpp>

; Standard ESP32-S3 (quad PSRAM, same as wifi_s3) with the OLED module
; re-enabled.  This is the build used for the CAN firmware release with OLED.
[env:wifi_s3_oled]
extends = env:wifi_s3
build_src_filter =
    ${common_esp32s3.build_src_filter}
    ${common_wifi.build_src_filter}
    +<../esp32/ESPNow>
    +<../esp32/OLED.cpp>
