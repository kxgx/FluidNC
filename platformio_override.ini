[env:oled]
extends = env:wifi
build_src_filter = ${env:wifi.build_src_filter} +<src/OLED.cpp>

; extra_scripts REPLACES the value inherited via "extends" rather than adding to
; it, so these must repeat ${common_esp32.extra_scripts} explicitly.  Leaving it
; out silently drops FluidNC/ld/esp32/vtable_in_dram.py, which is what puts the
; PinDetail and Spindle vtables in DRAM.  Without it they land in flash, and the
; step ISR reads them - which panics the board whenever the flash cache happens
; to be disabled.

[env:wifi]
extra_scripts =
    ${common_esp32.extra_scripts}
    pre:FluidNC/ld/esp32/i2s_engine_fpermissive.py

[env:noradio]
extra_scripts =
    ${common_esp32.extra_scripts}
    pre:FluidNC/ld/esp32/i2s_engine_fpermissive.py

[env:bt]
extra_scripts =
    ${common_esp32.extra_scripts}
    pre:FluidNC/ld/esp32/i2s_engine_fpermissive.py

; ESP32-S3 build for the custom board: same as wifi_s3_octalPSRAM plus the
; OLED module (esp32/OLED.cpp), which common_esp32s3 excludes by default.
[env:wifi_s3_octalPSRAM_oled]
extends = env:wifi_s3_octalPSRAM
build_src_filter =
    ${common_esp32s3.build_src_filter}
    ${common_wifi.build_src_filter}
    +<../esp32/ESPNow>
    +<../esp32/OLED.cpp>

; Standard ESP32-S3 (quad PSRAM, same as wifi_s3) with the OLED module
; re-enabled.  This is the build used for the CAN firmware release with OLED.
[env:wifi_s3_oled]
extends = env:wifi_s3
build_src_filter =
    ${common_esp32s3.build_src_filter}
    ${common_wifi.build_src_filter}
    +<../esp32/ESPNow>
    +<../esp32/OLED.cpp>

; Native USB CDC variants for ESP32-S3 boards without a USB-serial chip
; (new core board).  Keep ARDUINO_USB_MODE=1 (USB-Serial/JTAG hardware) and
; enable CDC-on-boot so the console enumerates on the native USB connector.
[env:wifi_s3_oled_usb]
extends = env:wifi_s3_oled
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=0
build_flags =
    ${common.build_flags}
    -std=gnu++17
    -D_GLIBCXX_HAVE_DIRENT_H
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DMCU=\"esp32s3\"
    -DVARIANT=\"wifi\"
    -DENABLE_WS_CHANNEL_PINS
    -IFluidNC/include
    -IFluidNC/src
    -IFluidNC/esp32
    -IFluidNC/esp32/esp32s3
    -IFluidNC/stdfs17
    -IFluidNC/stdfs17/include
    -Wl,-z,muldefs

[env:wifi_s3_octalPSRAM_oled_usb]
extends = env:wifi_s3_octalPSRAM_oled
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=0
build_flags =
    ${common.build_flags}
    -std=gnu++17
    -D_GLIBCXX_HAVE_DIRENT_H
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DMCU=\"esp32s3\"
    -DVARIANT=\"wifi\"
    -DENABLE_WS_CHANNEL_PINS
    -IFluidNC/include
    -IFluidNC/src
    -IFluidNC/esp32
    -IFluidNC/esp32/esp32s3
    -IFluidNC/stdfs17
    -IFluidNC/stdfs17/include
    -Wl,-z,muldefs


; 4 MB flash modules (actual U1 on the new core board reports 4 MB flash).
; Single app slot: OTA to a second partition is not available, but this keeps
; the 3 MB application and a small filesystem inside 4 MB.
[env:wifi_s3_oled_usb_4mb]
extends = env:wifi_s3_oled_usb
board_build.partitions = FluidNC/ld/esp32s3/app3M_spiffs1M_4MB.csv
custom_filesystem_start = 0x310000
board_upload.maximum_size = 4194304

[env:wifi_s3_octalPSRAM_oled_usb_4mb]
extends = env:wifi_s3_octalPSRAM_oled_usb
board_build.partitions = FluidNC/ld/esp32s3/app3M_spiffs1M_4MB.csv
custom_filesystem_start = 0x310000
board_upload.maximum_size = 4194304
