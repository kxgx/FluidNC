name: CAN firmware build and release

on:
  push:
    tags:
      - "can-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. can-v0.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          if ! [[ "$VERSION" =~ ^can-v[0-9]+\.[0-9]+\.[0-9]+([-.].*)?$ ]]; then
            echo "::error::Version must look like can-vX.Y.Z, got: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: can-pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'platformio_override.ini') }}

      # Build matrix:
      #   quad / octal PSRAM
      #   OLED / no OLED
      #   8 MB / 4 MB flash
      #   USB CDC where needed
      - name: Build ESP32-S3 CAN firmware variants
        run: |
          set -euxo pipefail
          for env in \
            wifi_s3_oled \
            wifi_s3_octalPSRAM_oled \
            wifi_s3 \
            wifi_s3_octalPSRAM \
            wifi_s3_oled_usb \
            wifi_s3_octalPSRAM_oled_usb \
            wifi_s3_oled_usb_4mb \
            wifi_s3_octalPSRAM_oled_usb_4mb \
            wifi_s3_oled_usb_4mb_nopsram; do
            pio run -e "$env"
          done

      - name: Generate addrinfo for every variant
        run: |
          set -euxo pipefail
          for env in \
            wifi_s3_oled \
            wifi_s3_octalPSRAM_oled \
            wifi_s3 \
            wifi_s3_octalPSRAM \
            wifi_s3_oled_usb \
            wifi_s3_octalPSRAM_oled_usb \
            wifi_s3_oled_usb_4mb \
            wifi_s3_octalPSRAM_oled_usb_4mb \
            wifi_s3_oled_usb_4mb_nopsram; do
            python tools/stack_trace_decoder/generate_addrinfo.py \
              ".pio/build/$env/firmware.elf" \
              -o ".pio/build/$env/firmware.addrinfo" \
              --build "$env" --verbose
          done

      - name: Assemble release files
        env:
          TAG: ${{ steps.version.outputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euxo pipefail
          mkdir -p release-assets

          # Default: existing 8 MB quad-PSRAM OLED board, standard names.
          for file in firmware.factory.bin firmware.bin bootloader.bin partitions.bin firmware.addrinfo; do
            cp ".pio/build/wifi_s3_oled/$file" "release-assets/$file"
          done

          # Everything else is prefixed.  Keep this list in sync with the build list.
          variants="
            wifi_s3_octalPSRAM_oled s3-octal-oled
            wifi_s3 s3-quad
            wifi_s3_octalPSRAM s3-octal
            wifi_s3_oled_usb s3-quad-oled-usb
            wifi_s3_octalPSRAM_oled_usb s3-octal-oled-usb
            wifi_s3_oled_usb_4mb s3-quad-oled-usb-4mb
            wifi_s3_octalPSRAM_oled_usb_4mb s3-octal-oled-usb-4mb
            wifi_s3_oled_usb_4mb_nopsram s3-quad-nopsram-oled-usb-4mb
          "
          echo "$variants" | while read -r env label; do
            [ -z "$env" ] && continue
            for file in firmware.factory.bin firmware.bin bootloader.bin partitions.bin firmware.addrinfo; do
              cp ".pio/build/$env/$file" "release-assets/${label}-${file}"
            done
          done

          python - "$TAG" <<'PY'
          import hashlib, json, os, sys
          tag = sys.argv[1]
          d = "release-assets"

          def digest(name):
              h = hashlib.sha256()
              with open(os.path.join(d, name), "rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          def info(name, offset):
              return {
                  "size": os.path.getsize(os.path.join(d, name)),
                  "offset": offset,
                  "path": name,
                  "signature": {"algorithm": "SHA2-256", "value": digest(name)},
              }

          manifest = {
              "name": "FluidCAN",
              "version": tag,
              "source_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/tree/{os.environ['GITHUB_SHA']}",
              "release_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/tag/{tag}",
              "images": {
                  "fluidcan-factory": info("firmware.factory.bin", "0x0"),
                  "fluidcan-app": info("firmware.bin", "0x10000"),
                  "fluidcan-bootloader": info("bootloader.bin", "0x1000"),
                  "fluidcan-partitions": info("partitions.bin", "0x8000"),
              },
              "installable": {
                  "name": "installable",
                  "description": "FluidCAN CAN firmware",
                  "choice-name": "Processor type",
                  "choices": [{
                      "name": "esp32s3",
                      "description": "ESP32-S3-WROOM-1 (quad PSRAM + OLED)",
                      "choice-name": "安装方式",
                      "choices": [{
                          "name": "can-full",
                          "description": "完整写入 CAN 固件（factory image @ 0x0）",
                          "erase": True,
                          "images": ["fluidcan-factory"],
                      }],
                  }],
              },
          }
          with open(os.path.join(d, "manifest.json"), "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)

          checksum_files = sorted(
              n for n in os.listdir(d)
              if os.path.isfile(os.path.join(d, n)) and n.endswith((".bin", ".addrinfo"))
          )
          with open(os.path.join(d, "SHA256SUMS"), "w", encoding="utf-8") as f:
              for name in checksum_files:
                  f.write(f"{digest(name)}  {name}\n")
          PY

          # Default zip keeps the standard manifest for the desktop installer.
          (cd release-assets && zip -9 "../fluidcan-${TAG}.zip" \
            firmware.factory.bin firmware.bin bootloader.bin partitions.bin \
            firmware.addrinfo manifest.json SHA256SUMS)

          # One self-contained zip per additional variant.
          echo "$variants" | while read -r env label; do
            [ -z "$env" ] && continue
            (cd ".pio/build/$env" && zip -9 "../../../fluidcan-${TAG}-${label}.zip" \
              firmware.factory.bin firmware.bin bootloader.bin partitions.bin firmware.addrinfo)
          done

          ls -lh release-assets fluidcan-*.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: fluidcan-wifi-s3-multi-${{ steps.version.outputs.version }}
          path: |
            release-assets/*
            fluidcan-*.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: FluidCAN ${{ steps.version.outputs.version }}
          body: |
            Automatic CAN firmware build for ESP32-S3.

            ## Default: 8 MB quad PSRAM + OLED

            Top-level `firmware.factory.bin`, `manifest.json` etc. are the
            original `wifi_s3_oled` build.

            ## All variants

            | Env | Flash | PSRAM | OLED | USB | File prefix |
            |---|---|---|---|---|---|
            | `wifi_s3_oled` (default) | 8 MB | Quad | Yes | No | — |
            | `wifi_s3_octalPSRAM_oled` | 8 MB | Octal | Yes | No | `s3-octal-oled-` |
            | `wifi_s3` | 8 MB | Quad | No | No | `s3-quad-` |
            | `wifi_s3_octalPSRAM` | 8 MB | Octal | No | No | `s3-octal-` |
            | `wifi_s3_oled_usb` | 8 MB | Quad | Yes | Yes | `s3-quad-oled-usb-` |
            | `wifi_s3_octalPSRAM_oled_usb` | 8 MB | Octal | Yes | Yes | `s3-octal-oled-usb-` |
            | `wifi_s3_oled_usb_4mb` | 4 MB | Quad | Yes | Yes | `s3-quad-oled-usb-4mb-` |
            | `wifi_s3_octalPSRAM_oled_usb_4mb` | 4 MB | Octal | Yes | Yes | `s3-octal-oled-usb-4mb-` |
            | `wifi_s3_oled_usb_4mb_nopsram` | 4 MB | None | Yes | Yes | `s3-quad-nopsram-oled-usb-4mb-` |

            The 4 MB variants use a single application slot (no OTA fallback).
            Do not flash an 8 MB image onto a 4 MB module, and do not use a Quad
            image on an Octal-PSRAM module.

            Board: ESP32-S3-WROOM-1  
            Default display: SSD1306 128x64 on i2c0 (SDA GPIO8 / SCL GPIO9, address 0x3C)  
            Source: `${{ github.sha }}`
          files: |
            release-assets/*
            fluidcan-*.zip
          draft: false
          prerelease: false
          make_latest: true
