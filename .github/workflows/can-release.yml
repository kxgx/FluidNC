name: CAN firmware build and release

on:
  push:
    tags:
      - "can-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. can-v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          if ! [[ "$VERSION" =~ ^can-v[0-9]+\.[0-9]+\.[0-9]+([-.].*)?$ ]]; then
            echo "::error::Version must look like can-vX.Y.Z, got: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: can-pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'platformio_override.ini') }}

      - name: Build ESP32-S3 CAN firmware
        run: pio run -e wifi_s3

      - name: Generate addrinfo
        run: |
          python tools/stack_trace_decoder/generate_addrinfo.py \
            .pio/build/wifi_s3/firmware.elf \
            -o .pio/build/wifi_s3/firmware.addrinfo \
            --build wifi_s3 --verbose

      - name: Assemble release files
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release-assets
          cp .pio/build/wifi_s3/firmware.factory.bin release-assets/
          cp .pio/build/wifi_s3/firmware.bin release-assets/
          cp .pio/build/wifi_s3/bootloader.bin release-assets/
          cp .pio/build/wifi_s3/partitions.bin release-assets/
          cp .pio/build/wifi_s3/firmware.addrinfo release-assets/
          python - "$TAG" <<'PY'
          import hashlib, json, os, sys
          tag = sys.argv[1]
          d = "release-assets"
          def digest(name):
              h = hashlib.sha256()
              with open(os.path.join(d, name), "rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()
          def info(name, offset, key):
              return {
                  "size": os.path.getsize(os.path.join(d, name)),
                  "offset": offset,
                  "path": name,
                  "signature": {"algorithm": "SHA2-256", "value": digest(name)},
              }
          manifest = {
              "name": "FluidCAN",
              "version": tag,
              "source_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/tree/{os.environ['GITHUB_SHA']}",
              "release_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/tag/{tag}",
              "images": {
                  "fluidcan-factory": info("firmware.factory.bin", "0x0", "factory"),
                  "fluidcan-app": info("firmware.bin", "0x10000", "app"),
                  "fluidcan-bootloader": info("bootloader.bin", "0x1000", "bootloader"),
                  "fluidcan-partitions": info("partitions.bin", "0x8000", "partitions"),
              },
              "installable": {
                  "name": "installable",
                  "description": "FluidCAN CAN firmware",
                  "choice-name": "Processor type",
                  "choices": [{
                      "name": "esp32s3",
                      "description": "ESP32-S3-WROOM-1",
                      "choice-name": "安装方式",
                      "choices": [{
                          "name": "can-full",
                          "description": "完整写入 CAN 固件（factory image @ 0x0）",
                          "erase": True,
                          "images": ["fluidcan-factory"],
                      }],
                  }],
              },
          }
          with open(os.path.join(d, "manifest.json"), "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          with open(os.path.join(d, "SHA256SUMS"), "w", encoding="utf-8") as f:
              for name in ["firmware.factory.bin", "firmware.bin", "bootloader.bin", "partitions.bin"]:
                  f.write(f"{digest(name)}  {name}\n")
          PY
          cd release-assets
          zip -9 "../fluidcan-${TAG}.zip" *
          cd ..
          ls -lh release-assets "fluidcan-${TAG}.zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: fluidcan-wifi-s3-${{ steps.version.outputs.version }}
          path: |
            release-assets/*
            fluidcan-${{ steps.version.outputs.version }}.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: FluidCAN ${{ steps.version.outputs.version }}
          body: |
            Automatic CAN firmware build.

            Board: ESP32-S3-WROOM-1 / wifi_s3
            Source: `${{ github.sha }}`
            Installer manifest: `manifest.json`
          files: |
            release-assets/firmware.factory.bin
            release-assets/firmware.bin
            release-assets/bootloader.bin
            release-assets/partitions.bin
            release-assets/manifest.json
            release-assets/SHA256SUMS
            release-assets/firmware.addrinfo
            fluidcan-${{ steps.version.outputs.version }}.zip
          draft: false
          prerelease: false
          make_latest: true
