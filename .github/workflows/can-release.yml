name: CAN firmware build and release

on:
  push:
    tags:
      - "can-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. can-v0.2.3"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          if ! [[ "$VERSION" =~ ^can-v[0-9]+\.[0-9]+\.[0-9]+([-.].*)?$ ]]; then
            echo "::error::Version must look like can-vX.Y.Z, got: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

  # Each variant is an independent job, so GitHub runs them in parallel.
  # A failing variant does not delay the others; the release job waits for all.
  build:
    needs: prepare
    runs-on: ubuntu-24.04
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: wifi_s3_oled_usb
            label: wifi-8mb-quad
            flash: 8MB
            psram: Quad
            oled: yes
            usb: yes
          - env: wifi_s3_octalPSRAM_oled_usb
            label: wifi-8mb-octal
            flash: 8MB
            psram: Octal
            oled: yes
            usb: yes
          - env: wifi_s3_octalPSRAM_oled_usb_16mb
            label: wifi-16mb-octal
            flash: 16MB
            psram: Octal
            oled: yes
            usb: yes
          - env: wifi_s3_oled_usb_4mb
            label: wifi-4mb-quad
            flash: 4MB
            psram: Quad
            oled: yes
            usb: yes
          - env: wifi_s3_octalPSRAM_oled_usb_4mb
            label: wifi-4mb-octal
            flash: 4MB
            psram: Octal
            oled: yes
            usb: yes
          - env: wifi_s3_oled_usb_4mb_nopsram
            label: wifi-4mb-nopsram
            flash: 4MB
            psram: None
            oled: yes
            usb: yes
          - env: noradio_s3_oled_usb
            label: nowifi-8mb-quad
            flash: 8MB
            psram: Quad
            oled: yes
            usb: yes
          - env: noradio_s3_octalPSRAM_oled_usb
            label: nowifi-8mb-octal
            flash: 8MB
            psram: Octal
            oled: yes
            usb: yes
          - env: noradio_s3_octalPSRAM_oled_usb_16mb
            label: nowifi-16mb-octal
            flash: 16MB
            psram: Octal
            oled: yes
            usb: yes
          - env: noradio_s3_oled_usb_4mb
            label: nowifi-4mb-quad
            flash: 4MB
            psram: Quad
            oled: yes
            usb: yes
          - env: noradio_s3_octalPSRAM_oled_usb_4mb
            label: nowifi-4mb-octal
            flash: 4MB
            psram: Octal
            oled: yes
            usb: yes
          - env: noradio_s3_oled_usb_4mb_nopsram
            label: nowifi-4mb-nopsram
            flash: 4MB
            psram: None
            oled: yes
            usb: yes
    name: build-${{ matrix.env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.version }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: can-pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'platformio_override.ini') }}-${{ matrix.env }}
          restore-keys: |
            can-pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'platformio_override.ini') }}-
            can-pio-${{ runner.os }}-

      - name: Build ${{ matrix.env }}
        run: pio run -e "${{ matrix.env }}"

      - name: Generate addrinfo
        run: |
          python tools/stack_trace_decoder/generate_addrinfo.py \
            ".pio/build/${{ matrix.env }}/firmware.elf" \
            -o ".pio/build/${{ matrix.env }}/firmware.addrinfo" \
            --build "${{ matrix.env }}" \
            --tag "${{ needs.prepare.outputs.version }}" \
            --mcu esp32s3 --verbose

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp ".pio/build/${{ matrix.env }}/firmware.factory.bin" dist/
          cp ".pio/build/${{ matrix.env }}/firmware.bin" dist/
          cp ".pio/build/${{ matrix.env }}/bootloader.bin" dist/
          cp ".pio/build/${{ matrix.env }}/partitions.bin" dist/
          cp ".pio/build/${{ matrix.env }}/firmware.addrinfo" dist/
          BOOT_APP0=$(find "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions" -name boot_app0.bin | head -1)
          if [ -n "$BOOT_APP0" ]; then cp "$BOOT_APP0" dist/boot_app0.bin; fi

      - name: Upload ${{ matrix.label }}
        uses: actions/upload-artifact@v6
        with:
          name: firmware-${{ matrix.label }}
          path: dist/*

  release:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.version }}

      - name: Download all variant artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: firmware-*
          path: artifacts
          merge-multiple: false

      - name: Package release zips
        env:
          TAG: ${{ needs.prepare.outputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euxo pipefail
          ls -R artifacts
          python tools/package_can_release.py \
            --artifacts artifacts \
            --out packages \
            --tag "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          ls -lh packages

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: fluidcan-wifi-s3-multi-${{ needs.prepare.outputs.version }}
          path: packages/*.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: FluidCAN ${{ needs.prepare.outputs.version }}
          body: |
            Automatic CAN firmware build for ESP32-S3.

            USB and OLED are included in every release. Studio exposes only the
            two radio choices (WiFi / NoWiFi) and auto-selects the hardware
            variant from the connected device; each asset below is the
            matching structured zip.

            Every zip has this layout:

            ```text
            <variant>/
              README.txt
              OTA/
                firmware.bin          # app image at 0x10000
                firmware.addrinfo
                manifest.json         # OTA/installer metadata
                README.txt
                SHA256SUMS
              USB/
                firmware.factory.bin  # full image at 0x0
                bootloader.bin        # 0x0 on ESP32-S3
                partitions.bin        # 0x8000
                firmware.addrinfo
                manifest.json
                README.txt
                SHA256SUMS
            ```

            OTA uses `OTA/firmware.bin`; USB full flash uses `USB/firmware.factory.bin`.
            The factory image writes bootloader/partitions/NVS from 0x0; it can reset
            NVS configuration even with erase=false. Prefer OTA for normal upgrades.

            | Variant | Env | Flash | PSRAM | OLED | USB | Release zip |
            |---|---|---|---|---|---|---|
            | `wifi-8mb-quad` | `wifi_s3_oled_usb` | 8 MB | Quad | Yes | Yes | `fluidcan-<tag>-wifi-8mb-quad.zip` |
            | `wifi-8mb-octal` | `wifi_s3_octalPSRAM_oled_usb` | 8 MB | Octal | Yes | Yes | `fluidcan-<tag>-wifi-8mb-octal.zip` |
            | `wifi-16mb-octal` | `wifi_s3_octalPSRAM_oled_usb_16mb` | 16 MB | Octal | Yes | Yes | `fluidcan-<tag>-wifi-16mb-octal.zip` |
            | `wifi-4mb-quad` | `wifi_s3_oled_usb_4mb` | 4 MB | Quad | Yes | Yes | `fluidcan-<tag>-wifi-4mb-quad.zip` |
            | `wifi-4mb-octal` | `wifi_s3_octalPSRAM_oled_usb_4mb` | 4 MB | Octal | Yes | Yes | `fluidcan-<tag>-wifi-4mb-octal.zip` |
            | `wifi-4mb-nopsram` | `wifi_s3_oled_usb_4mb_nopsram` | 4 MB | None | Yes | Yes | `fluidcan-<tag>-wifi-4mb-nopsram.zip` |
            | `nowifi-8mb-quad` | `noradio_s3_oled_usb` | 8 MB | Quad | Yes | Yes | `fluidcan-<tag>-nowifi-8mb-quad.zip` |
            | `nowifi-8mb-octal` | `noradio_s3_octalPSRAM_oled_usb` | 8 MB | Octal | Yes | Yes | `fluidcan-<tag>-nowifi-8mb-octal.zip` |
            | `nowifi-16mb-octal` | `noradio_s3_octalPSRAM_oled_usb_16mb` | 16 MB | Octal | Yes | Yes | `fluidcan-<tag>-nowifi-16mb-octal.zip` |
            | `nowifi-4mb-quad` | `noradio_s3_oled_usb_4mb` | 4 MB | Quad | Yes | Yes | `fluidcan-<tag>-nowifi-4mb-quad.zip` |
            | `nowifi-4mb-octal` | `noradio_s3_octalPSRAM_oled_usb_4mb` | 4 MB | Octal | Yes | Yes | `fluidcan-<tag>-nowifi-4mb-octal.zip` |
            | `nowifi-4mb-nopsram` | `noradio_s3_oled_usb_4mb_nopsram` | 4 MB | None | Yes | Yes | `fluidcan-<tag>-nowifi-4mb-nopsram.zip` |

            The 4 MB variants use a single application slot. Network OTA is not
            available; use serial `write-flash 0x10000 OTA/firmware.bin` to keep
            the filesystem/config. USB factory is a full reinstall, not the
            normal upgrade path.

            Board: ESP32-S3-WROOM-1  
            Default display: SSD1306 128x64 on i2c0 (SDA GPIO8 / SCL GPIO9, address 0x3C)  
            Source: `${{ github.sha }}`
          files: |
            packages/*.zip
          draft: false
          prerelease: false
          make_latest: true
